name: Link check

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Fails only when a course page is gone (404 or 410). Blocked bots and timeouts are
      # printed as "unknown" and do not fail the run.
      - name: Check course links
        run: npm run links
